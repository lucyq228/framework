<title>MVM Relationship Graph Demo</title>
<style>
:root {--blue:#4B78C2;--yellow:#F2C94C;--green:#6FB24A;--edge:#5B6B7A;--text:#17202A;--muted:#667085;--panel:#F8FAFC;--border:#D0D5DD;}
* {box-sizing:border-box;} body {margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:#fff;}
.topbar {position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.96);}
.title {font-weight:700;margin-right:auto;} .hint {color:var(--muted);font-size:13px;}
button {border:1px solid var(--border);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;}
button:hover {background:var(--panel);}
.legend {display:flex;gap:14px;flex-wrap:wrap;font-size:13px;align-items:center;}
.legend-item {display:inline-flex;gap:6px;align-items:center;}
.dot {width:13px;height:13px;border-radius:50%;display:inline-block;border:1px solid #333;}
#viewport {width:100%;height:calc(100vh - 96px);overflow:auto;position:relative;background:linear-gradient(#fff,#fff) padding-box,repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(75,120,194,.04) 40px);}
#graph {display:block;background:#fff;} .edge {fill:none;stroke:var(--edge);stroke-width:1.6;}
.node circle {stroke:#333;stroke-width:1.4;cursor:pointer;} .node text {text-anchor:middle;dominant-baseline:middle;pointer-events:none;font-size:13px;font-weight:600;}
.node .type-label {font-size:10px;font-weight:400;fill:#667085;} .node:hover circle {stroke-width:2.5;}
.tooltip {position:fixed;display:none;z-index:20;max-width:320px;padding:8px 10px;border-radius:8px;background:#111827;color:#fff;font-size:12px;pointer-events:none;}
</style></head>

    <span class="legend-item"><span class="dot" style="background:var(--green)"></span>Answerable</span>
  </div>

</div>
<div id="viewport"><svg id="graph"></svg></div><div id="tooltip" class="tooltip"></div>

    g.addEventListener("dblclick", (event) => { event.stopPropagation(); const hasKids = (children.get(id)||[]).length > 0; if (!hasKids) return; if (expanded.has(id)) expanded.delete(id); else expanded.add(id); scaleMode = "actual"; render(); centerOnNode(id); });
    g.addEventListener("mouseenter", () => { tooltip.style.display = "block"; tooltip.innerHTML = `<strong>${escapeHtml(n.name)}</strong><br>Type: ${escapeHtml(n.type)}` + (n.state ? `<br>State: ${escapeHtml(n.state)}` : ""); });
    g.addEventListener("mousemove", (event) => { tooltip.style.left = (event.clientX + 14) + "px"; tooltip.style.top = (event.clientY + 14) + "px"; });
    g.addEventListener("mouseleave", () => { tooltip.style.display = "none"; });
    svg.appendChild(g);
  }
  applyScaleMode();
}
document.getElementById("expandBtn").addEventListener("click", () => { for (const n of allNodes) if ((children.get(n.id)||[]).length > 0) expanded.add(n.id); scaleMode = "actual"; render(); viewport.scrollTo({left:0, top:0, behavior:"smooth"}); });
document.getElementById("collapseBtn").addEventListener("click", () => { expanded.clear(); for (const n of allNodes) if (n.level <= 1) expanded.add(n.id); scaleMode = "actual"; render(); viewport.scrollTo({left:0, top:0, behavior:"smooth"}); });
document.getElementById("fitBtn").addEventListener("click", () => { scaleMode = "fit"; applyScaleMode(); viewport.scrollTo({left:0, top:0, behavior:"smooth"}); });
document.getElementById("actualBtn").addEventListener("click", () => { scaleMode = "actual"; applyScaleMode(); });
window.addEventListener("resize", () => { if (scaleMode === "fit") applyScaleMode(); });
render();
</script></body></html>
